# Corre las pruebas del backend contra un PostgreSQL real y compila el
# frontend en cada push y pull request. Si algo se rompe, GitHub lo marca
# en rojo antes de que llegue a la rama principal.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Jest + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        # Mismas credenciales que backend/.env.test
        env:
          POSTGRES_USER: ritmoapp
          POSTGRES_PASSWORD: ritmoapp_dev
          POSTGRES_DB: ritmoapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ritmoapp -d ritmoapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://ritmoapp:ritmoapp_dev@localhost:5432/ritmoapp_test?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # AM-03: falla si la cobertura baja de 80 % de líneas o 70 % de ramas
      # (los mínimos están en jest.config.js).
      - run: npm run test:coverage
      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const fila = (n, m) => `| ${n} | ${m.pct} % | ${m.covered} de ${m.total} |`;
              console.log(["### Cobertura del backend", "", "| Métrica | % | Cubiertas |", "|---|---|---|",
                fila("Líneas", t.lines), fila("Ramas", t.branches), fila("Funciones", t.functions), fila("Sentencias", t.statements),
                "", "Mínimo: 80 % de líneas y 70 % de ramas."].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage/
          retention-days: 30

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # AM-04: pruebas de componentes con Vitest y Testing Library.
      - run: npm test
      - run: npm run build
