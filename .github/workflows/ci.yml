# Corre las pruebas del backend contra un PostgreSQL real y compila el
# frontend en cada push y pull request. Si algo se rompe, GitHub lo marca
# en rojo antes de que llegue a la rama principal.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Jest + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        # Mismas credenciales que backend/.env.test
        env:
          POSTGRES_USER: ritmoapp
          POSTGRES_PASSWORD: ritmoapp_dev
          POSTGRES_DB: ritmoapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ritmoapp -d ritmoapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://ritmoapp:ritmoapp_dev@localhost:5432/ritmoapp_test?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
