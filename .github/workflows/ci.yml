# Corre las pruebas del backend contra un PostgreSQL real y compila el
# frontend en cada push y pull request. Si algo se rompe, GitHub lo marca
# en rojo antes de que llegue a la rama principal.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Jest + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        # Mismas credenciales que backend/.env.test
        env:
          POSTGRES_USER: ritmoapp
          POSTGRES_PASSWORD: ritmoapp_dev
          POSTGRES_DB: ritmoapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ritmoapp -d ritmoapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://ritmoapp:ritmoapp_dev@localhost:5432/ritmoapp_test?schema=public

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # --ignore-scripts: ningún paquete corre scripts al instalarse (riesgo de
      # cadena de suministro que marcó SonarCloud). Prisma baja sus motores al
      # usarse, y los comandos van por npm run para usar la versión del lockfile.
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      # AM-03: falla si la cobertura baja de 80 % de líneas o 70 % de ramas
      # (los mínimos están en jest.config.js).
      - run: npm run test:coverage
      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const fila = (n, m) => `| ${n} | ${m.pct} % | ${m.covered} de ${m.total} |`;
              console.log(["### Cobertura del backend", "", "| Métrica | % | Cubiertas |", "|---|---|---|",
                fila("Líneas", t.lines), fila("Ramas", t.branches), fila("Funciones", t.functions), fila("Sentencias", t.statements),
                "", "Mínimo: 80 % de líneas y 70 % de ramas."].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: backend/coverage/
          retention-days: 30

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # AM-04: pruebas de componentes con Vitest y Testing Library.
      - run: npm test
      - run: npm run build

  e2e:
    name: De punta a punta (Playwright)
    runs-on: ubuntu-latest
    # AM-05 (DOC-07): un navegador de verdad recorre la app contra la API real
    # y un PostgreSQL con los datos de demostración, solo para esta prueba.

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ritmoapp
          POSTGRES_PASSWORD: ritmoapp_dev
          POSTGRES_DB: ritmoapp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ritmoapp -d ritmoapp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ritmoapp:ritmoapp_dev@localhost:5432/ritmoapp_e2e?schema=public
      JWT_SECRET: solo-para-la-prueba-de-punta-a-punta
      PORT: 4000

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Preparar la API con los datos de demostración
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npm run prisma:generate
          npm run prisma:deploy
          npm run prisma:seed
          npm run prisma:seed:demo
      - name: Encender la API
        working-directory: backend
        run: |
          nohup node src/server.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: Instalar el frontend y Chromium
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta
        working-directory: frontend
        run: npx playwright test
      - name: Guardar el informe si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informe-playwright
          path: frontend/playwright-report/
          retention-days: 14
