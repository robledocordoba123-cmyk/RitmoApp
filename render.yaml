# Configuración de la API en Render como código (Blueprint).
# En Render: New → Blueprint → elegir este repositorio.
#
# La base de datos NO se crea aquí: vive en Neon (el PostgreSQL gratuito de
# Render se borra a los 30 días). Su URL se pega a mano en DATABASE_URL la
# primera vez; nunca va en el repositorio.
services:
  - type: web
    name: ritmoapp-api
    runtime: node
    region: ohio            # misma región que la base de datos en Neon
    plan: free
    rootDir: backend
    # --include=dev: el CLI de Prisma (migraciones) es devDependency y con
    # NODE_ENV=production npm lo omitiría.
    buildCommand: npm ci --include=dev && npx prisma generate
    # Demo pública: aplica migraciones pendientes, recarga los datos de
    # demostración (la agenda queda siempre alrededor de "hoy") y arranca la API.
    # Para una academia real se usa `npm run start:produccion` (sin datos de demo)
    # y el SuperAdmin se crea una vez con `npm run crear:superadmin` (ver README).
    startCommand: npm run start:demo
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: TZ_ACADEMIAS
        value: America/Bogota
      # Saltos de proxy delante de la API en Render (Cloudflare, balanceador y
      # proxy interno). Con menos, el límite de intentos no ve la IP real (DEF-01).
      - key: TRUST_PROXY
        value: "3"
      # Render genera un secreto largo y aleatorio; nadie necesita conocerlo.
      - key: JWT_SECRET
        generateValue: true
      # Estas dos se piden al crear el Blueprint (sync: false = no están en el repo).
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Clave de las tareas diarias (POST /api/tareas/diarias). Debe ser la misma
      # que el secreto TAREAS_TOKEN de GitHub. Si falta, la ruta responde 404.
      - key: TAREAS_TOKEN
        sync: false
